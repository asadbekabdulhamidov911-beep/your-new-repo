{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-[#f2f4f7] flex items-center justify-center p-4">
    <div class="w-full max-w-[420px] bg-white rounded-2xl shadow-lg p-6 md:p-8">

        <h2 class="text-2xl font-bold text-gray-900 text-center mb-6">
            Ro‘yxatdan o‘tish
        </h2>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Email</label>
                <div class="relative flex items-center">
                    <span class="absolute left-3 text-gray-400">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input class="w-full h-11 pl-10 pr-4 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-800 placeholder-gray-400 focus:bg-white focus:border-[#7000ff] focus:ring-2 focus:ring-[#7000ff]/20 outline-none transition-all" type="email" placeholder="Email"
                        name="email" required>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Foydalanuvchi nomi</label>
                <div class="relative flex items-center">
                    <span class="absolute left-3 text-gray-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input class="w-full h-11 pl-10 pr-4 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-800 placeholder-gray-400 focus:bg-white focus:border-[#7000ff] focus:ring-2 focus:ring-[#7000ff]/20 outline-none transition-all" type="text" placeholder="username"
                        name="username" required>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Parol</label>
                <div class="relative flex items-center">
                    <span class="absolute left-3 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input id="password" class="w-full h-11 pl-10 pr-10 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-800 placeholder-gray-400 focus:bg-white focus:border-[#7000ff] focus:ring-2 focus:ring-[#7000ff]/20 outline-none transition-all" type="password"
                        placeholder="Password" name="password" required>
                    <button type="button" onclick="togglePassword('password', 'eye-icon-1')" class="absolute right-3 text-gray-400 hover:text-gray-600 focus:outline-none">
                        <i id="eye-icon-1" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Parolni tasdiqlang</label>
                <div class="relative flex items-center">
                    <span class="absolute left-3 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input id="confirm_password" class="w-full h-11 pl-10 pr-10 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-800 placeholder-gray-400 focus:bg-white focus:border-[#7000ff] focus:ring-2 focus:ring-[#7000ff]/20 outline-none transition-all"
                        type="password" placeholder="Confirm password" name="confirm_password" required>
                    <button type="button" onclick="togglePassword('confirm_password', 'eye-icon-2')" class="absolute right-3 text-gray-400 hover:text-gray-600 focus:outline-none">
                        <i id="eye-icon-2" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full h-11 bg-[#7000ff] hover:bg-[#5a00cc] text-white font-semibold rounded-xl text-sm transition-all">
                Ro‘yxatdan o‘tish
            </button>
        </form>

        <p class="text-center text-xs text-gray-500 mt-6">
            Akkountingiz bormi? <a href="{% url 'login' %}" class="text-[#7000ff] font-semibold hover:underline">Kirish</a>
        </p>
    </div>
</div>
{% endblock %}
